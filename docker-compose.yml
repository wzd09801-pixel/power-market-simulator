services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-power_market}
      POSTGRES_USER: ${POSTGRES_USER:-power}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-power}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-power} -d ${POSTGRES_DB:-power_market}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_NAME: ${APP_NAME:-Power Market Simulator}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://power:power@db:5432/power_market}
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_TIMEOUT_SECONDS: ${OPEN_METEO_TIMEOUT_SECONDS:-10}
      OPEN_METEO_MAX_RETRIES: ${OPEN_METEO_MAX_RETRIES:-2}
      OPEN_METEO_RETRY_BACKOFF_SECONDS: ${OPEN_METEO_RETRY_BACKOFF_SECONDS:-0.25}
      MARKET_HEALTH_TIMEOUT_SECONDS: ${MARKET_HEALTH_TIMEOUT_SECONDS:-5}
      MARKET_HEALTH_MAX_RETRIES: ${MARKET_HEALTH_MAX_RETRIES:-1}
      MARKET_HEALTH_RETRY_BACKOFF_SECONDS: ${MARKET_HEALTH_RETRY_BACKOFF_SECONDS:-0.25}
      MARKET_HEALTH_MIN_INTERVAL_SECONDS: ${MARKET_HEALTH_MIN_INTERVAL_SECONDS:-30}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-power-market-raw}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding-service:8090}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: sh -c "python -m backend.app.db.migration_consistency && alembic upgrade head"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://power:power@db:5432/power_market}
    depends_on:
      db:
        condition: service_healthy

  cockpit:
    build:
      context: .
      dockerfile: Dockerfile.cockpit
    ports:
      - "${COCKPIT_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  prefect-server:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: prefect worker start --pool ${PREFECT_WORK_POOL:-local-workstation} --type process
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
    depends_on:
      prefect-server:
        condition: service_healthy

  prefect-scheduler:
    profiles: ["schedules"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m workers.scheduled
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://power:power@db:5432/power_market}
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
    depends_on:
      migrate:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy

  operation-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m workers.consume
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://power:power@db:5432/power_market}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-power-market-raw}
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_TIMEOUT_SECONDS: ${OPEN_METEO_TIMEOUT_SECONDS:-10}
      OPEN_METEO_MAX_RETRIES: ${OPEN_METEO_MAX_RETRIES:-2}
      OPEN_METEO_RETRY_BACKOFF_SECONDS: ${OPEN_METEO_RETRY_BACKOFF_SECONDS:-0.25}
      BENCH_DISPATCH_TIMEOUT_SECONDS: ${BENCH_DISPATCH_TIMEOUT_SECONDS:-20}
      BENCH_DISPATCH_MAX_RETRIES: ${BENCH_DISPATCH_MAX_RETRIES:-2}
      BENCH_DISPATCH_RETRY_BACKOFF_SECONDS: ${BENCH_DISPATCH_RETRY_BACKOFF_SECONDS:-0.5}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_DEFAULT_MODEL: ${DEEPSEEK_DEFAULT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_DEEP_ANALYSIS_MODEL: ${DEEPSEEK_DEEP_ANALYSIS_MODEL:-deepseek-v4-pro}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
      OPERATION_WORKER_POLL_SECONDS: ${OPERATION_WORKER_POLL_SECONDS:-2}
      OPERATION_WORKER_LEASE_SECONDS: ${OPERATION_WORKER_LEASE_SECONDS:-300}
      OPERATION_WORKER_RETRY_DELAY_SECONDS: ${OPERATION_WORKER_RETRY_DELAY_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    ports:
      - "8090:8090"

volumes:
  postgres_data:
  minio_data:
