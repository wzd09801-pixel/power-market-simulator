server {
  listen 80;
  server_name _;

  location /v1/ {
    proxy_pass http://api:8000;
  }

  location /healthz {
    proxy_pass http://api:8000;
  }

  location / {
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/html text/css application/javascript application/json text/plain;
    try_files $uri /index.html;
  }
}
