[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-market-simulator"
version = "0.1.0"
description = "Example Province power-market intelligence and human-reviewed hydro trading advice MVP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "dnspython>=2.8,<3",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "beautifulsoup4>=4.12,<5",
    "pgvector>=0.3,<1",
    "prefect>=3.4,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<1",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["backend", "frontend", "workers"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = []
